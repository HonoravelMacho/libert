[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libert"
version = "0.4.1"
description = "CLI instantânea para download de livros do welib (yt-dlp de livros)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HonoravelMacho" }]
keywords = ["welib", "ebook", "download", "cli", "livros"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Utilities",
]
dependencies = [
  "requests>=2.28",
  "cloudscraper>=1.2.71",
  "beautifulsoup4>=4.11",
  "rich>=13",
]

[project.scripts]
libert = "libert.cli:main"

[project.urls]
Homepage = "https://github.com/HonoravelMacho/libert"
Repository = "https://github.com/HonoravelMacho/libert"

[tool.setuptools.packages.find]
where = ["."]
include = ["libert*"]
